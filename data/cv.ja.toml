[hero]
name = "鄭恪悠"
enName = "Keyou (Key) Zheng"
furiganaName = "鄭|恪|悠"
location = "広州・広東"
age = ""
bio = """
こんにちは、**Keyou (Key) Zheng** です。<BioMark icon="mingcute:microscope-line" effect="research">駆け出しの研究者</BioMark>、<BioMark icon="mingcute:translate-line" effect="drift">CJK 言語の漂流者</BioMark>、そして <BioMark icon="mingcute:palette-line" effect="craft">ジュニアデザインエンジニア</BioMark>です。2026 年 6 月に広東工業大学で機械工学修士号を取得しました。2027 年 4 月より北海道大学の<BioMark icon="mingcute:mortarboard-line" effect="graduate">情報科学博士課程</BioMark>に進学し、メディアダイナミクス研究室（LMD）で Guang Li 助教の指導を受ける予定です。

研究は大規模言語モデル、パラメトリック CAD、HCI の交差領域にあり、人間の設計意図を信頼可能で機械実行可能なコードへ変換することに取り組んでいます。修士課程では、生成と検証を閉ループでつなぐエージェント型ワークフローを構築しました。関連する筆頭著者論文 **SPADA** は ICML 2026 のポスター論文として採択されました。

学部での計算機科学の訓練により強固な技術基盤を得る一方、デザインと人間中心コンピューティングの継続的な独学を通じてツールへの考え方を磨いてきました。技術的厳密性と実用性を両立するシステムを重視しています。

研究室の外では、<BioMark icon="mingcute:game-2-line" effect="beat">音楽ゲーム好き</BioMark>として、オープンソース開発、インターフェース設計の実践、執筆を継続しています。タイポグラフィ、明快なインタラクション、保守しやすいコードを大切にし、ソフトウェア・デザイン・研究を横断して価値を届ける作り手として成長することを目指しています。
"""

